plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = mod_version
group = maven_group

base {
	archivesName = archives_base_name
}

repositories {

	// no idea
	maven {
		name = "Greenhouse Maven"
		url = 'https://repo.greenhouse.house/releases/'
	}

	// Veil
	maven { url "https://maven.blamejared.com/" }

	// Porting Lib
	maven { url "https://mvn.devos.one/snapshots/" 	}
	maven { url "https://mvn.devos.one/releases/" }

	// Reach Entity Attributes
	maven {
		name "reach entity attributes"
		url "https://maven.jamieswhiteshirt.com/libs-release"
	}

	// Fabric ASM
	maven {
		url "https://jitpack.io/"
		content {
			excludeGroup "io.github.fabricators_of_create"
		}
	}

	// Mod Menu, EMI, Trinkets
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}

	// Modrinth
	maven {
		name "modrinth"
		url "https://api.modrinth.com/maven"
	}

	// CCA, Satin
	maven {
		name "Ladysnake Libs"
		url "https://maven.ladysnake.org/releases"
	}

	maven {
		name "architectury"
		url "https://maven.shedaniel.me"
	}

	maven {
		name "geckolib"
		url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven"
	}

	maven {
		name "jitpack"
		url "https://jitpack.io"
	}

	// common protection api
	maven { url "https://maven.nucleoid.xyz/" }

	// Datasync
	maven { url = "https://maven.uuid.gg/releases" }
}

configurations.all {
	resolutionStrategy.eachDependency { details ->
		if (details.requested.group == "org.lwjgl") {
			details.useVersion("3.3.1")
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"

	mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	include(modImplementation("com.github.Chocohead:Fabric-ASM:${fabric_asm_version}")) {
		exclude (group: "net.fabricmc.fabric-api")
	}

	// Dependencies
	include modApi("com.jamieswhiteshirt:reach-entity-attributes:${reach_entity_attributes_version}")
	include modApi("dev.emi:trinkets:${trinkets_version}")
	modImplementation "dev.upcraft.datasync:datasync-minecraft-1.20.1-fabric:0.6.1"
	// lodestone
	modImplementation "team.lodestar.lodestone:lodestone:${project.lodestone_version}"
	include "team.lodestar.lodestone:lodestone:${project.lodestone_version}"
	for (String module in portinglib_modules.split(",")) {
		include "io.github.fabricators_of_create.Porting-Lib:$module:${project.portinglib_version}"
		modImplementation "io.github.fabricators_of_create.Porting-Lib:$module:${project.portinglib_version}"
	}

	// CCA
	include modApi("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cardinal_components_version}")
	include modApi("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${cardinal_components_version}")
	include modApi("dev.onyxstudios.cardinal-components-api:cardinal-components-world:${cardinal_components_version}")
	// Includes Cardinal Components API as a Jar-in-Jar dependency (optional)
	include "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
	include "dev.onyxstudios.cardinal-components-api:cardinal-components-world:${project.cardinal_components_version}"
	include "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"

	//* arsenal
	modImplementation "dev.doctor4t:Arsenal:${arsenal_version}"
	modImplementation "com.jamieswhiteshirt:reach-entity-attributes:${reach_entity_attributes_version}"
	modImplementation "dev.upcraft.datasync:datasync-minecraft-1.20.1-fabric:0.6.1"
	modImplementation "dev.doctor4t:ratatouille:${ratatouille_version}"
	//*/

	//* Compat mods
	// Enchancement
	modImplementation "maven.modrinth:enchancement:${enchancement_version}"
	//modCompileOnly "maven.modrinth:enchancement:${enchancement_version}"
	//modImplementation "io.github.ladysnake:BLAST:${blast_version}"
	modCompileOnly "io.github.ladysnake:BLAST:${blast_version}"
	//*/

	//* Runtime Mods
	//modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
	modLocalRuntime "dev.emi:emi-fabric:${emi_version}"
	modRuntimeOnly "maven.modrinth:jade:${jade_version}"
	modImplementation "org.ladysnake:satin:${satin_version}"
	// Include Satin as a Jar-in-Jar dependency (optional)
	include "org.ladysnake:satin:${satin_version}"
	include modApi("com.github.emilyploszaj:step-height-entity-attribute:${step_height_entity_attribute_version}")
	include modApi("maven.modrinth:midnightlib:${midnightlib_version}")
	modImplementation include("eu.pb4:common-protection-api:1.0.0")
	modImplementation "org.ladysnake:pick-your-poison:${pyp_version}"
	modRuntimeOnly "maven.modrinth:tooltipfix:${tooltipfix_version}"
	modCompileOnly("com.github.apace100:apoli:${apoli_version}") {
		exclude(group: "*")
	}
	modCompileOnly "maven.modrinth:architectury-api:${architectury_version}+fabric"
	modCompileOnly "software.bernie.geckolib:geckolib-fabric-${geckolib_version}"
	modCompileOnly "maven.modrinth:sodium:${sodium_version}"
	modRuntimeOnly "maven.modrinth:sodium:${sodium_version}"
	implementation "org.joml:joml:1.10.4"
	modCompileOnly "maven.modrinth:spectrum:${spectrum_version}"
	modRuntimeOnly "com.terraformersmc:modmenu:${mod_menu_version}"
	//*/
}

fabricApi {
	configureDataGeneration()
}

processResources {
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand (
			"version": inputs.properties.version
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}